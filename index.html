<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars Explorations</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#ddd;font:14px system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;left:12px;top:10px;pointer-events:none;white-space:pre;text-shadow:0 0 3px #000}
  body.shot #hud{display:none}

  /* ---- gameplay HUD (src/game). Mission-instrument style; never shown in ?shot mode. ---- */
  :root{
    --g-ink:#e9eef2; --g-dim:rgba(233,238,242,.62); --g-faint:rgba(233,238,242,.38); --g-line:rgba(255,255,255,.16);
    --g-panel:rgba(7,11,15,.66); --g-ok:#7fdca4; --g-warn:#ffb347; --g-bad:#ff6b5b; --g-accent:#9ad0ff;
    --g-num:"D-DIN","DIN Alternate","DIN Condensed","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
    --g-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  body.shot .g-root{display:none}
  body.play #hud{display:none}   /* scene debug text; the game HUD replaces it */
  .g-root{position:fixed;inset:0;pointer-events:none;color:var(--g-ink);font:13px/1.35 var(--g-num);letter-spacing:.02em;z-index:5}
  .g-root button,.g-root a,.g-root canvas.g-plotcv,.g-pad,.g-overlay,.g-menu,.g-build,.g-help{pointer-events:auto}
  .g-root .hidden{display:none!important}
  .g-top{position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .g-title{display:flex;align-items:baseline;gap:10px;padding:6px 12px;background:var(--g-panel);border:1px solid var(--g-line);border-radius:3px}
  .g-title b{font-size:15px;letter-spacing:.12em}
  .g-title span{font:11px var(--g-mono);color:var(--g-dim);letter-spacing:.08em}
  .g-status{flex:1;display:flex;gap:12px;font:11px var(--g-mono);letter-spacing:.08em;color:var(--g-dim);min-width:120px}
  .g-status .g-ap,.g-ap{color:#081018;background:var(--g-accent);padding:1px 6px;border-radius:2px}
  .g-warpbox{display:flex;align-items:center;gap:4px}
  .g-warp{font:12px var(--g-mono);min-width:104px;text-align:center;padding:5px 8px;border:1px solid var(--g-line);border-radius:3px;background:var(--g-panel)}
  .g-warp.active{color:var(--g-warn);border-color:rgba(255,179,71,.5)}
  .g-btn{font:600 12px var(--g-num);letter-spacing:.1em;color:var(--g-ink);background:rgba(20,28,36,.78);border:1px solid rgba(255,255,255,.28);border-radius:3px;padding:7px 12px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
  .g-btn:hover{border-color:rgba(255,255,255,.6)}
  .g-btn:focus-visible{outline:2px solid var(--g-accent);outline-offset:1px}
  .g-btn.on{background:rgba(154,208,255,.3);border-color:var(--g-accent)}
  .g-btn.primary{border-color:var(--g-accent);color:#fff;background:rgba(40,80,120,.7)}
  .g-btn.warn{border-color:rgba(255,179,71,.7)}
  .g-btn.g-small{padding:5px 9px;font-size:11px}
  .g-panel{position:absolute;background:var(--g-panel);border:1px solid var(--g-line);border-radius:3px;padding:10px 12px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .g-panel.g-inline{position:static;background:none;border:0;padding:6px 0 0;backdrop-filter:none}
  .g-left{left:12px;top:58px;width:300px}
  .g-right{right:12px;top:58px;width:340px}
  .g-center{left:50%;top:58px;transform:translateX(-50%);width:260px}
  .g-ptitle{margin:0 0 8px;font:600 11px var(--g-mono);letter-spacing:.16em;color:var(--g-dim);text-transform:uppercase}
  .g-row{display:grid;grid-template-columns:1fr auto 44px;align-items:baseline;gap:8px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .g-lab{font-size:11px;letter-spacing:.1em;color:var(--g-dim);text-transform:uppercase}
  .g-val{font:500 16px var(--g-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .g-unit{font:10px var(--g-mono);color:var(--g-faint)}
  .g-small{font-size:11px!important}
  .g-barrow{grid-template-columns:96px 1fr 74px;align-items:center}
  .g-bar{display:block;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  .g-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(255,255,255,.55),#fff);border-radius:3px;transition:width .15s linear}
  [data-state="ok"] .g-bar i{background:linear-gradient(90deg,#4ea878,var(--g-ok))}
  [data-state="bad"] .g-bar i{background:linear-gradient(90deg,#b0453a,var(--g-bad))}
  [data-state="bad"] .g-val,[data-state="bad"]>.g-val{color:var(--g-bad)}
  .g-val[data-state="bad"]{color:var(--g-bad)}
  .g-msg{font-size:13px;line-height:1.4;color:var(--g-ink);padding:2px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--g-line);min-height:36px}
  .g-note{font-size:12px;color:var(--g-dim)}
  b.ok,.ok{color:var(--g-ok)} b.warn,.warn{color:var(--g-warn)} b.bad,.bad{color:var(--g-bad)}
  .g-toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-6px);opacity:0;transition:opacity .25s,transform .25s;padding:7px 14px;background:rgba(7,11,15,.85);border:1px solid var(--g-line);border-radius:3px;font:12px var(--g-mono);letter-spacing:.06em;white-space:nowrap}
  .g-toast.show{opacity:1;transform:translate(-50%,0)}
  .g-pad{position:absolute;right:12px;display:grid;gap:6px}
  .g-pad-right{bottom:158px}
  .g-pad-low{bottom:12px}
  .g-padrow{display:flex;gap:6px;justify-content:flex-end}
  .g-pad .g-btn{min-width:74px;padding:10px 8px}
  .g-help{position:absolute;right:12px;top:58px;z-index:3;background:rgba(7,11,15,.92);border:1px solid var(--g-line);border-radius:3px;padding:12px 14px;max-width:380px}
  .g-help table{border-collapse:collapse} .g-help td{padding:3px 8px 3px 0;font-size:12px;vertical-align:top}
  kbd{font:11px var(--g-mono);padding:1px 5px;border:1px solid rgba(255,255,255,.35);border-radius:2px;background:rgba(255,255,255,.06);white-space:nowrap}
  .g-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);z-index:10;padding:16px}
  .g-dialog{background:rgba(9,13,18,.95);border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:22px 24px;max-width:560px;width:100%}
  .g-dialog h2{margin:0 0 10px;font:600 22px var(--g-num);letter-spacing:.14em}
  .g-dialog h2.bad{color:var(--g-bad)}
  .g-dialog p{margin:0 0 12px}
  .g-summary{color:var(--g-dim);margin-bottom:12px;font-size:13px}
  .g-dlgbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  table.g-score{border-collapse:collapse;width:100%;font-size:13px}
  table.g-score td,table.g-score th{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top}
  table.g-score th{font:10px var(--g-mono);letter-spacing:.1em;color:var(--g-dim)}
  table.g-score .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.g-score tr.tot td{font-size:16px;font-weight:600;border-bottom:0;padding-top:10px}
  .grade{display:inline-block;margin-left:8px;padding:0 7px;border:1px solid currentColor;border-radius:2px;color:var(--g-accent)}

  /* webcast strip (launch) */
  .g-webcast{position:absolute;left:0;right:0;bottom:0;height:150px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 28px 12px;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.55) 30%,rgba(0,0,0,.82));gap:20px}
  .g-wc-block{display:flex;align-items:center;gap:22px;transition:opacity .4s}
  .g-wc-ship{justify-content:flex-end}
  .g-wc-block.dim{opacity:.33}
  .g-wc-engines{width:96px;height:96px;flex:none}
  .g-wc-tele{display:grid;gap:3px;min-width:230px}
  .g-wc-name{font:11px var(--g-mono);letter-spacing:.18em;color:var(--g-dim)}
  .g-wc-line{display:grid;grid-template-columns:104px 1fr 44px;align-items:baseline}
  .g-wc-line .k,.g-wc-tank .k{font:600 17px var(--g-num);letter-spacing:.04em}
  .g-wc-line .v{font:600 22px var(--g-num);text-align:right;font-variant-numeric:tabular-nums;padding-right:8px}
  .g-wc-line .u{font:600 13px var(--g-num)}
  .g-wc-tank{display:grid;grid-template-columns:50px 1fr;align-items:center;margin-top:2px}
  .g-wc-tank .k{font-size:14px}
  .g-wc-tbar{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
  .g-wc-tbar i{display:block;height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.55),#fff)}
  .g-wc-att{width:84px;height:96px;flex:none}
  .g-wc-icon{width:100%;height:100%;overflow:visible}
  .g-wc-icon .hz{stroke:rgba(255,255,255,.45);stroke-width:.7}
  .g-wc-icon .veh path{fill:none;stroke:#fff;stroke-width:1.3}
  .g-wc-centre{text-align:center;min-width:240px}
  .g-wc-clock{font:600 38px var(--g-num);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .g-wc-title{font:600 15px var(--g-num);letter-spacing:.06em}
  .g-wc-events{margin-top:6px;display:flex;gap:10px;justify-content:center;font:10px var(--g-mono);color:var(--g-dim);letter-spacing:.08em;min-height:14px}

  /* phase instruments */
  .g-dockcv{display:block;width:100%;height:220px}
  .g-plot{width:420px}
  .g-plotcv{display:block;width:100%;height:320px;cursor:crosshair}
  .g-gauges{width:320px}
  .g-profcv{display:block;width:100%;height:150px;margin-top:8px}
  .g-sideview{width:300px}
  .g-sidecv{display:block;width:100%;height:300px}
  .g-landeng{width:80px;height:80px;margin:8px auto 0;display:block}
  .g-base{width:320px}
  .g-queue{margin:8px 0 4px;display:grid;gap:4px}
  .g-job{display:grid;grid-template-columns:1fr 80px 84px;align-items:center;gap:8px;font-size:12px}
  .g-job[data-state="bad"] .g-small{color:var(--g-warn)}
  .g-obj{border-top:1px solid var(--g-line);padding-top:6px;font-size:12px}
  .g-obj [data-state="ok"]{color:var(--g-ok)}
  .g-camlabel{position:absolute;left:50%;top:100px;transform:translateX(-50%);font:12px var(--g-mono);letter-spacing:.2em;padding:3px 12px;border-left:2px solid rgba(255,255,255,.6);border-right:2px solid rgba(255,255,255,.6)}
  .g-minimap{left:12px;bottom:12px;width:210px;padding:6px}
  .g-mapcv{display:block;width:100%;height:198px}
  .g-build{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(660px,calc(100vw - 32px));background:rgba(9,13,18,.95);border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:16px 18px;z-index:4}
  .g-build tr[data-k]{cursor:pointer} .g-build tr[data-k]:hover td{background:rgba(154,208,255,.08)}

  /* mission-select menu */
  .g-menu{position:absolute;inset:0;overflow:auto;padding:40px 16px 32px;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.45) 60%,rgba(0,0,0,.2))}
  .g-menu>*{max-width:860px;margin-left:max(0px,calc(50vw - 560px))}
  .g-eyebrow{font:12px var(--g-mono);letter-spacing:.24em;color:var(--g-accent)}
  .g-mhead h1{margin:4px 0 8px;font:700 clamp(30px,5vw,52px)/1 var(--g-num);letter-spacing:.12em}
  .g-mhead .g-note{max-width:62ch;font-size:14px}
  .g-camp{margin:20px 0 14px;padding:14px 16px;background:var(--g-panel);border:1px solid var(--g-line);border-radius:3px}
  .g-progress{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}
  .g-progress i{height:4px;background:rgba(255,255,255,.15);border-radius:2px}
  .g-progress i[data-state="complete"]{background:var(--g-ok)} .g-progress i[data-state="available"]{background:rgba(154,208,255,.6)}
  .g-campinfo{font:12px var(--g-mono);letter-spacing:.1em;color:var(--g-dim)}
  .g-cards{list-style:none;padding:0;margin:0;display:grid;gap:8px}
  .g-card{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:12px 14px;background:var(--g-panel);border:1px solid var(--g-line);border-radius:3px}
  .g-card.focus{border-color:var(--g-accent)}
  .g-cardnum{font:600 22px var(--g-num);color:var(--g-faint)}
  .g-cardtitle{font:600 16px var(--g-num);letter-spacing:.12em}
  .g-cardmeta{display:flex;gap:12px;margin-top:4px;font:10px var(--g-mono);letter-spacing:.1em;color:var(--g-dim)}
  .g-cardmeta [data-st="COMPLETE"]{color:var(--g-ok)} .g-cardmeta [data-st="NEXT"]{color:var(--g-accent)}
  .g-mfoot{margin-top:18px} .g-mfoot a{color:var(--g-accent)}

  @media (max-width:900px){
    .g-left,.g-right,.g-base,.g-plot,.g-gauges,.g-sideview{width:calc(50vw - 20px)}
    .g-right{top:auto;bottom:220px;max-height:40vh;overflow:auto}
    .g-left{max-height:calc(100vh - 380px);overflow:auto}
    .g-plotcv{height:200px} .g-sidecv{height:180px} .g-dockcv{height:150px}
    .g-webcast{height:118px;padding:8px 12px;gap:8px}
    .g-wc-att{display:none} .g-wc-engines{width:64px;height:64px}
    .g-wc-tele{min-width:0} .g-wc-line{grid-template-columns:70px 1fr 36px}
    .g-wc-line .k{font-size:13px} .g-wc-line .v{font-size:16px} .g-wc-clock{font-size:24px} .g-wc-centre{min-width:0}
    .g-pad-right{bottom:124px} .g-pad .g-btn{min-width:58px;padding:9px 6px;font-size:11px}
    .g-minimap{width:150px} .g-mapcv{height:138px}
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
